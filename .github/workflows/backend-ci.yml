# SPEC-PLAT-01 R11: build + all tests (unit, Testcontainers integration, ArchUnit, OpenAPI contract) for gc-backend,
# then fail on API contract drift (the build regenerates gc-backend/contracts/*.openapi.json).
name: backend-ci

on:
  push:
    branches: [main]
    paths: ["gc-backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["gc-backend/**", ".github/workflows/backend-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: gc-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test (Testcontainers uses the runner's Docker)
        run: mvn -B -ntp verify

      - name: API contract drift (commit regenerated contracts with the API change)
        run: git diff --exit-code -- contracts/

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            gc-backend/**/target/surefire-reports/
            gc-backend/**/target/failsafe-reports/
            gc-backend/**/target/site/jacoco*/
          retention-days: 14
          if-no-files-found: ignore
