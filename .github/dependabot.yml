# SPEC-PLAT-02 R28: weekly, grouped dependency updates with Conventional-Commit titles.
version: 2
updates:
  - package-ecosystem: maven
    directory: /gc-backend
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    commit-message: { prefix: "build", include: scope }
    labels: [dependencies, backend]
    groups:
      spring:
        patterns: ["org.springframework*", "org.springdoc*"]
      test:
        patterns: ["org.testcontainers*", "org.junit*", "org.assertj*", "com.tngtech.archunit*", "org.mockito*"]
      other:
        patterns: ["*"]
        exclude-patterns: ["org.springframework*", "org.springdoc*", "org.testcontainers*", "org.junit*", "org.assertj*", "com.tngtech.archunit*", "org.mockito*"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "ci" }
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /gc-backend/local-dev
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "build", include: scope }
    labels: [dependencies, local-dev]
    # SPEC-PLAT-05 R70: stateful engines must match AWS (Aurora/RDS PostgreSQL; ElastiCache Redis 7 / Valkey) and need a
    # deliberate, spec'd upgrade test (partitions, Debezium replication slots). Minor/patch updates still come through.
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "redis"
        update-types: ["version-update:semver-major"]
