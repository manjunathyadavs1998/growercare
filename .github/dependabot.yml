# SPEC-PLAT-02 R28: weekly updates of the pinned actions (this repo and the repo kit).
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/templates/java-repo"]
    schedule: { interval: weekly, day: monday }
    commit-message: { prefix: "ci" }
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
